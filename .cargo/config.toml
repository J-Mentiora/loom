# Workspace-level Cargo configuration.

# wasm32-wasi-preview2 stray-target trap. The real WASM build target
# for `loom-surface-web` is `wasm32-wasip2`; if someone runs
# `cargo test --target wasm32-wasi-preview2` (the older spelling),
# fail loudly with actionable text rather than silently.
[target.wasm32-wasi-preview2]
runner = ["bash", "-c", "echo 'wasm32-wasi-preview2 is not the loom WASM target — use wasm32-wasip2 instead' >&2; exit 87"]

# Workspace-wide rustflags.
[target.'cfg(all())']
rustflags = [
    "-Dwarnings",   # treat warnings as errors in CI; comment out locally if noisy
    "-Wunused",
]
