[package]
name = "loom-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
loom-shared = { workspace = true }
loom-keychain = { workspace = true }
loom-core = { workspace = true }
loom-host = { workspace = true }
loom-rpc = { workspace = true }

ciborium = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_jcs = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
dirs = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
hex = { workspace = true }
# Per-session dispatch fence guard type (Session.dispatch_slot).
parking_lot = { workspace = true }
humantime = { workspace = true }
zeroize = { workspace = true }
# Reaper process primitives: kill(0)/killpg for orphan-Chromium GC.
libc = { workspace = true }

[lib]
name = "loom_daemon"
path = "src/lib.rs"

# Library-only package. The `loom-daemon` binary is built from
# `loom-cli/src/bin/loom-daemon.rs` (a thin shim calling
# `loom_daemon::run()`) so cargo-dist 0.30+ can ship all 4 loom
# binaries in a single tarball — its docs require all `[[bin]]`
# entries to be in one Cargo Package to bundle.
[package.metadata.dist]
dist = false

[lints]
workspace = true
