[package]
name = "loom-keychain"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description.workspace = true
keywords.workspace = true
categories.workspace = true

# Out-of-loom-core feature-gated keychain access (BC-CORE-02 +
# SR-CORE-01: no platform symbols inside `loom-core`). Phase 6 will
# fan this out into:
#   - macOS:   security-framework
#   - Linux:   secret-service
#   - Windows: windows-credentials
# All gated behind feature flags so loom-core remains
# platform-agnostic and the keychain crate is the ONLY place that
# pulls in OS-specific deps.

[dependencies]
zeroize = { workspace = true }

# Phase 6 will add platform-specific deps under [target.'cfg(...)'.dependencies]
# blocks; left empty at scaffold time.

[lints]
workspace = true
