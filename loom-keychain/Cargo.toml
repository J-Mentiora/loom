[package]
name = "loom-keychain"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
zeroize = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }

# macOS Security Framework backend — kSecClassGenericPassword storage
# with kSecAttrAccessible=WhenUnlockedThisDeviceOnly + kSecAttrCreator
# discriminator (squatting-prevention per AB8).
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"
security-framework-sys = "2"
core-foundation = "0.10"
core-foundation-sys = "0.8"

# Linux Secret Service backend — pure-Rust zbus client (no libdbus-1
# system dep needed for the crate; tests need a running daemon).
# `blocking` feature exposes the sync API matching this trait's shape.
[target.'cfg(target_os = "linux")'.dependencies]
secret-service = { version = "5", features = ["rt-tokio-crypto-rust"] }

[dev-dependencies]
rand = { workspace = true }

[lints]
workspace = true
