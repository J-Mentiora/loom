# cargo-deny configuration. Enforces:
#   - the chromiumoxide-only-in-loom-shims rule (Chromium driver lives
#     out-of-process, in one crate)
#   - no platform-specific keychain crates outside loom-keychain
#   - no `getrandom` reachable from WASM-guest surfaces
# License + advisory checks are enforced too; see [licenses] / [advisories].

[graph]
# All-features evaluation so feature-gated keychain backends are visible
# to the wrapper-allowlist rules (otherwise cargo-deny v2 reports the
# `loom-keychain` wrappers as unmatched).
all-features = true
no-default-features = false

[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
ignore = []

[licenses]
version = 2
# Exhaustive allow-list under v2 — any license not listed is denied.
# GPL-2.0/3.0, AGPL, LGPL, etc. fall through to the default-deny so the
# release artifacts stay license-clean.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "ISC",
    "Unicode-3.0",
    "MPL-2.0",
    "Zlib",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
# Path-only internal deps were treated as wildcards under cargo-deny v2 until
# `[workspace.dependencies]` learned to carry `version = "0.9.0"` for each
# loom-* path entry. With those pinned, this can be tightened back to "deny"
# in a future PR. Held at "warn" for now to keep the upgrade window open.
wildcards = "warn"
highlight = "all"

# ---- Per-crate / per-target bans ----
# These rules encode the workspace's architectural invariants. cargo-deny
# v2 matches `wrappers` against DIRECT parents in the resolved dep graph —
# transitive ancestors are not implicit wrappers. The lists below name the
# direct parents on the host target; `secret-service` and `windows-credentials`
# don't appear in the macOS/Linux graph respectively, so their `loom-keychain`
# wrappers exist as architectural documentation and produce a benign
# `unused-wrapper` warning on hosts where they're not built.

# 1. chromiumoxide may ONLY appear in loom-shims (out-of-process
#    Chromium driver). Forbid in every other crate.
[[bans.deny]]
name = "chromiumoxide"
wrappers = ["loom-shims"]

# 2. WASM guests (loom-surfaces) MUST NOT depend on `getrandom` —
#    randomness comes from the host's `host::rng-next-u64` only.
#    The wrappers list enumerates all current direct parents on the
#    macOS+Linux host targets — none of which reach loom-surfaces,
#    which is what enforces the architectural rule. New direct
#    parents will fail this ban and require a review here.
[[bans.deny]]
name = "getrandom"
wrappers = [
    "rand",            # rand 0.10 reaches getrandom directly (was via rand_core in 0.9)
    "rand_core",       # rand → ulid, jsonrpsee, etc.
    "ahash",           # jsonschema RNG seeding
    "redox_users",     # dirs Redox-OS path resolution
    "ring",            # crypto / vault
    "tempfile",        # temp file naming
    "jsonschema",      # schema validation engine RNG
    "referencing",     # jsonschema URI resolution helpers
    "jobserver",       # build-time make-jobserver client
]

# 3. Forbid platform-specific keychain crates outside loom-keychain.
#    `rustls-platform-verifier` and `rustls-native-certs` are also
#    allowed because they use these crates for OS-level TLS certificate
#    verification, not keychain ops.
[[bans.deny]]
name = "security-framework"
wrappers = ["loom-keychain", "rustls-platform-verifier", "rustls-native-certs"]

[[bans.deny]]
name = "security-framework-sys"
wrappers = ["loom-keychain", "rustls-platform-verifier", "security-framework"]

[[bans.deny]]
name = "secret-service"
wrappers = ["loom-keychain"]

[[bans.deny]]
name = "windows-credentials"
wrappers = ["loom-keychain"]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
