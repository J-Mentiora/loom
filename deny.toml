# cargo-deny configuration. Enforces SR-CORE-01 (no platform symbols
# in core), the chromiumoxide-only-in-loom-shims rule, and the
# no-getrandom/no-std-time rule for surface guests.

[graph]
# All_features evaluation so feature-gated keychain backends get checked.
all-features = false
no-default-features = false

[advisories]
# cargo-deny v2 schema:
#   `vulnerability` and `notice` were removed (severity is implicit).
#   `unmaintained` is now scope, not severity. "all" matches the prior
#     behavior of warning on every unmaintained crate (and the `ignore`
#     list below still suppresses individual cases).
#   `yanked` remains a severity.
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
unmaintained = "all"
yanked = "warn"
ignore = [
    # RUSTSEC-2025-0052: async-std discontinued (unmaintained).
    # Transitive via chromiumoxide → loom-shims only (out-of-process Chromium
    # driver). Not in the WASM execution path. Accepted risk until
    # chromiumoxide ships an async-std-free release.
    # AC-WTUPG-06 accepted-risk justification.
    { id = "RUSTSEC-2025-0052" },
]

[licenses]
# cargo-deny v2 schema:
#   `unlicensed`, `copyleft`, `default`, and `allow-osi-fsf-free` were
#   removed (see https://github.com/EmbarkStudios/cargo-deny/pull/611).
#   v2 evaluates licenses purely against `allow`: anything not on the
#   list (including unlicensed crates and copyleft licenses we didn't
#   explicitly opt into) is denied. Behavior is equivalent to the prior
#   `default = "deny"` + `unlicensed = "deny"` + `copyleft = "warn"`
#   when our `allow` list deliberately excludes copyleft licenses.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    # MIT-0 (MIT No Attribution): same terms as MIT minus the
    # attribution requirement. Transitively via
    # jsonschema -> referencing -> fluent-uri -> borrow-or-share.
    "MIT-0",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "MPL-2.0",
    "Zlib",
    # CDLA-Permissive-2.0 (Community Data License Agreement):
    # permissive data license, OSI-equivalent terms for our use.
    # Transitively via jsonrpsee -> rustls-platform-verifier ->
    # webpki-root-certs.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

# ---- Per-crate / per-target bans ----
# These three rules encode the binding-constraints architectural
# invariants. Phase 6 may tighten them further as new platforms land.

# 1. chromiumoxide may ONLY appear in loom-shims (out-of-process
#    Chromium driver). Forbid in every other crate.
[[bans.deny]]
name = "chromiumoxide"
wrappers = ["loom-shims"]

# 2. WASM guests (loom-surfaces) MUST NOT depend on `getrandom` —
#    randomness comes from the host's `host::rng-next-u64` only.
#    `wrappers` enumerates the DIRECT parents of `getrandom` in the
#    current dep graph (cargo-deny v2 semantics: direct parent must
#    appear in the list). Update when new transitive intermediates
#    appear; loom-surfaces must never be added.
[[bans.deny]]
name = "getrandom"
wrappers = [
    "ring",          # rustls / TLS crypto
    "rand_core",     # widely-used randomness trait crate
    "redox_users",   # dirs / config-dir resolver on redox targets
    "tempfile",      # dev-deps in several workspace crates
    "ahash",         # transitive via hashbrown
    "zip",           # loom-cli (chromium download extraction)
    "referencing",   # transitive via jsonschema
    "jsonschema",    # loom-cli, loom-rpc (schema validation)
    "jobserver",     # cargo build-script tooling
]
# (loom-surfaces deliberately not in any chain — i.e. forbidden there.)

# 3. Forbid platform-specific keychain crates outside loom-keychain
#    (BC-CORE-02 / SR-CORE-01). Same v2 wrapper semantics: direct
#    parents only. `rustls-*` parents are accepted because they pull
#    `security-framework` for TLS certificate validation, not for
#    keychain access — orthogonal to BC-CORE-02's intent.
[[bans.deny]]
name = "security-framework"
wrappers = [
    "loom-keychain",
    "rustls-platform-verifier",
    "rustls-native-certs",
]

[[bans.deny]]
name = "security-framework-sys"
wrappers = [
    "loom-keychain",
    "security-framework",
    "rustls-platform-verifier",
]

[[bans.deny]]
name = "secret-service"
wrappers = ["loom-keychain"]

[[bans.deny]]
name = "windows-credentials"
wrappers = ["loom-keychain"]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
