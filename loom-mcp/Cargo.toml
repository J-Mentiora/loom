[package]
name = "loom-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
loom-shared = { workspace = true }
loom-rpc = { workspace = true }

tokio = { workspace = true }
tokio-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_jcs = { workspace = true }
async-trait = { workspace = true }
parking_lot = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
futures = { workspace = true }
bytes = { workspace = true }
clap = { workspace = true }
dirs = { workspace = true }

[features]
default = []
mock = []

[lib]
path = "src/lib.rs"

# AC-PROTO-03.1 / mcp-binary-missing: produce target/release/loom-mcp so the
# `loom mcp serve` CLI subcommand can delegate to it via subprocess.
[[bin]]
name = "loom-mcp"
path = "src/bin/loom-mcp.rs"
