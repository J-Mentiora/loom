[package]
name = "loom-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
loom-shared = { workspace = true }
loom-rpc = { workspace = true }

tokio = { workspace = true }
tokio-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_jcs = { workspace = true }
async-trait = { workspace = true }
parking_lot = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
futures = { workspace = true }
bytes = { workspace = true }
clap = { workspace = true }
dirs = { workspace = true }

[features]
default = []
mock = []

[lib]
path = "src/lib.rs"

# Library-only package. The `loom-mcp` binary is built from
# `loom-cli/src/bin/loom-mcp.rs` (a thin clap wrapper calling
# `loom_mcp::mcp_main::run()`) so cargo-dist 0.30+ can ship all 4 loom
# binaries in a single tarball — its docs require all `[[bin]]` entries
# to be in one Cargo Package to bundle.
[package.metadata.dist]
dist = false

[lints]
workspace = true
