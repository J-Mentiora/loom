name: Publish @mentiora-ai/loom-sdk to npm

# Triggers:
#   - On a v* tag (same trigger that drives the cargo-dist binary release).
#     The npm publish runs in parallel with the binary release; if anything
#     fails here, binaries still ship — operator can re-run the npm publish
#     job from the Actions UI.
#   - Manual dispatch with an explicit version (for hotfix re-publishes
#     or dry-runs from a non-tag commit).
#
# Required secret:
#   NPM_TOKEN — granular npm access token, scoped to publish under the
#   `mentiora-ai` org / `@mentiora-ai` package scope. Generate at
#   npmjs.com → Access Tokens. Add to GitHub repo Secrets as NPM_TOKEN.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Run npm publish --dry-run only (no publish)"
        type: boolean
        default: false

permissions:
  contents: read
  # OIDC isn't used (npm provenance optional); plain NPM_TOKEN auth.

jobs:
  publish:
    name: Publish typescript-sdk
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: typescript-sdk
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org/"
          cache: npm
          cache-dependency-path: typescript-sdk/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify package.json version matches the tag
        # Skipped on workflow_dispatch (no tag).
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/v}"
          pkg=$(node -p "require('./package.json').version")
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag v$tag does not match package.json version $pkg"
            exit 1
          fi

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build (also runs via prepublishOnly; explicit step for visibility)
        run: npm run build

      - name: Publish (dry-run)
        if: github.event_name == 'workflow_dispatch' && inputs.dry-run
        run: npm publish --dry-run --access public

      - name: Publish
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.dry-run)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          # Prerelease versions (semver with a hyphen, e.g. 0.11.0-rc.1) must
          # not become the npm `latest` dist-tag — that is what a bare
          # `npm install @mentiora-ai/loom-sdk` resolves to. Publish them
          # under `next` instead, mirroring release.yml's
          # announcement_is_prerelease gate on the Homebrew publish. Derived
          # from package.json (not the git ref) so manual dispatches from a
          # non-tag commit get the same guard.
          version=$(node -p "require('./package.json').version")
          publish_args=(--access public)
          case "$version" in
            *-*) publish_args+=(--tag next) ;;
          esac
          npm publish "${publish_args[@]}"
