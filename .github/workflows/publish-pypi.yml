name: Publish mentiora-loom to PyPI

# Triggers:
#   - pull_request touching the Python SDK: build the sdist + wheel and run
#     `twine check` only (NO publish). This is the "package validates" gate
#     required by AC7 — it catches broken metadata / packaging before a tag.
#   - On a v* tag (the same trigger that drives the binary release and the npm
#     publish): build, verify the version matches the tag, then publish. Runs
#     in parallel with the binary release; if this job fails the binaries still
#     ship and the operator can re-run this job from the Actions UI.
#   - Manual dispatch with an explicit dry-run toggle, for verifying a build
#     from a non-tag commit without publishing.
#
# Required secret:
#   PYPI_TOKEN — a PyPI API token scoped to the `mentiora-loom` project (or an
#   account-wide token for the very first publish, since a project-scoped token
#   can't exist until the project does). Create at pypi.org → Account settings →
#   API tokens. Add to GitHub repo Secrets as PYPI_TOKEN.
#
# Before the first publish (one-time setup):
#   1. Confirm the `mentiora-loom` project name is registered/owned on PyPI
#      (org/account ownership — see PRD Risks, FND-0002/0007). If the name is
#      taken, surface it before tagging a release.
#   2. Add the PYPI_TOKEN repo secret (account-wide token for publish #1; rotate
#      to a project-scoped token afterwards).
#
# Emergency yank / rollback (FND-0013):
#   PyPI is append-only — you cannot overwrite or re-upload a version. To pull a
#   bad release:
#     - Yank (recommended): pypi.org → mentiora-loom → Manage → Releases →
#       "Yank". Yanked versions stay installable only when pinned exactly
#       (`pip install mentiora-loom==X.Y.Z`); resolvers skip them otherwise.
#       CLI: `pip install twine && twine yank mentiora-loom==X.Y.Z` (or via API).
#     - Delete (last resort): the same page allows deleting a release, but the
#       version number is then burned forever (PyPI never lets it be reused).
#       Prefer yank + a fixed patch release (X.Y.Z+1) over delete.

on:
  pull_request:
    paths:
      - "python-sdk/**"
      - ".github/workflows/publish-pypi.yml"
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Build + twine check only (no publish)"
        type: boolean
        default: true

# Cancel superseded PR validation runs (rebases / force-pushes). Tag and
# manual-dispatch runs are never auto-cancelled — cancelling a half-finished
# publish would be worse than letting it race.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Build + validate sdist/wheel
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: python-sdk
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install build tooling
        run: python -m pip install --upgrade pip build twine

      - name: Build sdist + wheel
        run: python -m build

      - name: Validate package metadata
        run: twine check dist/*

      - name: Verify version matches the tag
        # Only on a v* tag push. The built version comes from loom/__init__.py
        # (single source of truth — pyproject reads it via tool.hatch.version),
        # so this transitively guards __init__.py == pyproject == tag.
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/v}"
          # The built wheel is named mentiora_loom-<version>-py3-none-any.whl.
          whl=(dist/*.whl)
          built=$(basename "${whl[0]}" | sed -E 's/mentiora_loom-([^-]+)-.*/\1/')
          if [ "$tag" != "$built" ]; then
            echo "::error::tag v$tag does not match built version $built (set loom/__init__.py __version__)"
            exit 1
          fi
          echo "✓ tag v$tag matches built version $built"

      - name: Upload dist artifact
        uses: actions/upload-artifact@v7
        with:
          name: pypi-dist
          path: python-sdk/dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Publish on a real tag push, or a manual dispatch with dry-run unchecked.
    # PRs and dry-run dispatches stop after the build job above.
    # No prerelease gate needed here (unlike publish-npm.yml's dist-tag
    # handling): PyPI has no dist-tag concept and pip excludes pre-release
    # versions by default unless --pre or an exact pin is used.
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && !inputs.dry-run)
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v8
        with:
          name: pypi-dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_TOKEN }}
          packages-dir: dist/
          print-hash: true
