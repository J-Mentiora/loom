name: Verify NPM_TOKEN

# Manual-dispatch only. Authenticates against the npm registry using the
# NPM_TOKEN repo secret and verifies the user can publish under the
# expected scope. Useful as a sanity check before a real publish.
#
# This intentionally does not run on push or tag — it's a button you
# press from the Actions tab when you want to confirm the token is
# healthy.

on:
  workflow_dispatch:
    inputs:
      scope:
        description: "Scope to confirm the token can publish into (e.g. mentiora-ai or loom)"
        type: string
        default: "mentiora-ai"

permissions:
  contents: read

jobs:
  whoami:
    name: npm whoami + scope check
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org/"

      - name: Authenticate + npm whoami
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::NPM_TOKEN secret is empty or missing on this repo"
            exit 1
          fi
          who=$(npm whoami)
          echo "✓ NPM_TOKEN authenticates as: $who"
          echo "::notice title=npm whoami::$who"

      - name: List org memberships
        # `npm org ls <org>` lists members of an org the token can see.
        # If the token has no access to the org, this exits non-zero.
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          INPUT_SCOPE: ${{ inputs.scope }}
        run: |
          set -euo pipefail
          if npm org ls "$INPUT_SCOPE" >/tmp/org.txt 2>/tmp/org.err; then
            echo "✓ token can see members of npm org \`$INPUT_SCOPE\`:"
            cat /tmp/org.txt
            echo "::notice title=npm org \`$INPUT_SCOPE\`::accessible"
          else
            echo "::warning title=npm org \`$INPUT_SCOPE\`::token cannot list this org"
            echo "(this is expected if you used a Granular token scoped only to packages, not the full org)"
            cat /tmp/org.err
          fi

      - name: Probe publish capability
        # The most direct test of "can this token publish under <scope>?"
        # is `npm access list packages <scope>` — it enumerates every
        # package in the scope the token can manage. On a brand-new
        # scope with zero published packages, the empty list still means
        # "yes, the token can manage <scope>". Failure here is the
        # actionable signal.
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          INPUT_SCOPE: ${{ inputs.scope }}
        run: |
          set -euo pipefail
          if npm access list packages "@$INPUT_SCOPE" >/tmp/pkgs.json 2>/tmp/pkgs.err; then
            # `npm access list packages` returns either a JSON object or an
            # empty body when the scope has zero packages (brand-new scope).
            # Both are success signals — the auth + scope are valid. Fail
            # only if the command itself errored.
            if [ ! -s /tmp/pkgs.json ]; then
              echo "✓ token can manage scope @$INPUT_SCOPE (empty — no packages yet)"
              echo "::notice title=Scope @$INPUT_SCOPE::publish access confirmed (0 packages)"
            else
              count=$(node -p "Object.keys(require('/tmp/pkgs.json')).length")
              echo "✓ token can manage $count package(s) under scope @$INPUT_SCOPE"
              cat /tmp/pkgs.json
              echo "::notice title=Scope @$INPUT_SCOPE::publish access confirmed ($count packages)"
            fi
          else
            echo "::error title=Scope @$INPUT_SCOPE::token does NOT have publish access. See log."
            cat /tmp/pkgs.err
            exit 1
          fi
