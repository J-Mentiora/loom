# Automated dependency updates.
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  # Cargo workspace — security advisories + minor/patch upgrades.
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "rust"
    groups:
      # Group routine patch/minor bumps so the PR queue doesn't fan out.
      patch-updates:
        update-types:
          - "patch"
      minor-updates:
        update-types:
          - "minor"

  # GitHub Actions — keeps action-version pins fresh + auto-patches CVEs.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "ci"
