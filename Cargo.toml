[workspace]
resolver = "2"
members = [
    "loom-shared",
    "loom-keychain",
    "loom-core",
    "loom-host",
    "loom-rpc",
    "loom-mcp",
    "loom-cli",
    "loom-daemon",
    "loom-surfaces",
    "loom-shims",
    "loom-surface-web",
]

[workspace.package]
version = "0.9.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.92"
authors = ["Mentiora <hi@mentiora.com>"]
repository = "https://github.com/J-Mentiora/loom"
homepage = "https://github.com/J-Mentiora/loom"
description = "Agent-first browser automation runtime — deterministic Chromium sessions with replay-equal hash chains, MCP-native tools, and a content-addressed action store."
keywords = ["browser", "automation", "agent", "chromium", "mcp"]
categories = ["command-line-utilities", "development-tools::testing", "web-programming"]

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"

# Serde + canonicalization (BC §4)
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_jcs = "0.1"

# WASM (loom-host only)
wasmtime = { version = "44", features = ["component-model", "async"] }
wasmtime-wasi = "44"
wit-bindgen = "0.40"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
gimli = "0.31"
addr2line = "0.24"
ciborium = "0.2"

# RPC
jsonrpsee = { version = "0.24", features = ["server", "client", "macros"] }

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Chromium devtools (loom-shims only)
chromiumoxide = "0.6"

# Vault crypto (loom-core only)
ring = "0.17"
zeroize = { version = "1", features = ["derive"] }

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# General
async-trait = "0.1"
dashmap = "6"
parking_lot = "0.12"
thiserror = "1"
anyhow = "1"
filetime = "0.2"
tempfile = "3"
ulid = "1"
walkdir = "2"
toml = "0.8"
uuid = { version = "1", features = ["v4", "serde"] }

# loom-rpc: auth + schema validation
rand = "0.8"
jsonschema = "0.46"
subtle = "2"
hex = "0.4"
sha2 = "0.10"
tar = "0.4"
flate2 = "1"
zip = "2"
dirs = "6"
bytes = "1"
futures = "0.3"
humantime = "2"

# IPC + low-level (loom-host shim spawn site, loom-shims FD inheritance)
rustix = { version = "1", features = ["net", "process"] }
libc = "0.2"

# WebSocket — only as a dev-dep for the stub CDP harness (AC-SHCRT-06).
# Not allowed in production code paths (cargo-deny enforced; chromiumoxide
# transitively pulls async-tungstenite for real CDP).
tokio-tungstenite = "0.21"

# Internal crates (path deps)
loom-shared = { path = "loom-shared" }
loom-keychain = { path = "loom-keychain" }
loom-core = { path = "loom-core" }
loom-host = { path = "loom-host" }
loom-rpc = { path = "loom-rpc" }
loom-mcp = { path = "loom-mcp" }
loom-daemon = { path = "loom-daemon" }
loom-surfaces = { path = "loom-surfaces" }
loom-shims = { path = "loom-shims" }

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

# wasm-guest: compile profile for the loom-surface-web cdylib invoked
# recursively from loom-cli/build.rs. Wasmtime AOT-compiles the cdylib
# at postinstall time, so fat-LTO on the guest is wasted work and adds
# 45-90s to every cold loom-cli build. lto=false + codegen-units=16
# brings cold wasm-guest builds to ~10s.
[profile.wasm-guest]
inherits = "release"
lto = false
codegen-units = 16

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
