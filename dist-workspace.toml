[workspace]
members = ["cargo:."]

[dist]
# Generated by cargo-dist v0.25.x — do not hand-edit unless you know
# what you're doing. `cargo dist init` rewrites this file.
cargo-dist-version = "0.25.1"
ci = "github"
# AC-DIST-03: ship a Homebrew formula in addition to the curl-pipe
# shell installer. `tap = "..."` tells cargo-dist where to push the
# autogenerated `Formula/loom.rb` on each release. The push uses the
# `HOMEBREW_TAP_TOKEN` repo secret (a fine-grained PAT with
# `contents:write` on `J-Mentiora/homebrew-loom`). A hand-written
# reference draft of the formula lives at `dist/homebrew/loom.rb`.
installers = ["shell", "homebrew"]
tap = "J-Mentiora/homebrew-loom"
# Without this, cargo-dist generates Formula/<crate>.rb files but doesn't
# push them to the tap repo. The push requires a `HOMEBREW_TAP_TOKEN`
# repo secret (a fine-grained PAT with `contents:write` on the tap repo).
publish-jobs = ["homebrew"]
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
]
# Ship all four binaries in the same tarball.
# cargo-dist auto-detects [[bin]] entries from the workspace.
pr-run-mode = "plan"
