[workspace]
members = ["cargo:."]

[dist]
# Generated by `dist init` and hand-edited to enable the homebrew installer
# now that the J-Mentiora/homebrew-loom tap exists.
#
# AC-DIST-02 / AC-DIST-03 follow-up: when ready to bump cargo-dist itself,
# run `cargo install cargo-dist@<latest>` and `dist init --yes` to regenerate
# `.github/workflows/release.yml` cleanly. Pinned to 0.25.1 today because the
# release.yml is the 0.25.1 generation; mixing the two would risk a runtime
# mismatch.
cargo-dist-version = "0.25.1"
ci = "github"
installers = ["shell", "homebrew"]
tap = "J-Mentiora/homebrew-loom"
publish-jobs = ["homebrew"]
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
]
# Ship all four binaries in the same tarball.
# cargo-dist auto-detects [[bin]] entries from the workspace.
pr-run-mode = "plan"
