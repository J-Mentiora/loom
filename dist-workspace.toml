[workspace]
members = ["cargo:."]

[dist]
# Generated by cargo-dist v0.25.x — do not hand-edit unless you know
# what you're doing. `cargo dist init` rewrites this file.
cargo-dist-version = "0.25.1"
ci = "github"
installers = ["shell"]
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
]
# Ship all four binaries in the same tarball.
# cargo-dist auto-detects [[bin]] entries from the workspace.
pr-run-mode = "plan"

[dist.dependencies.homebrew]
# Homebrew taps need a manual `cargo dist init` flag-flip; we'll add
# the `homebrew` installer once we have a tap (J-Mentiora/homebrew-tap).
