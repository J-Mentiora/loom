[package]
name = "loom-surfaces"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description.workspace = true
keywords.workspace = true
categories.workspace = true

# Surfaces compile to a host-side `lib` for unit tests; the
# wasm32-wasi-preview2 target wiring (proper build.rs + wit-bindgen
# against `../wit/loom-surface.wit`) is future work. The v0.9 release
# ships only the WEB surface; shell / fs / api / native are declared
# in WIT but not built.

[dependencies]
loom-shared = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
serde_jcs = { workspace = true }
ciborium = { workspace = true }
thiserror = { workspace = true }

# wit-bindgen guest bindings — declared at compile time from
# ../wit/loom-surface.wit. The build.rs + wit_bindgen! macro invocation
# is future work. Stub for now.
wit-bindgen = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }

[features]
default = []
mock = []

[lib]
path = "src/lib.rs"
# `crate-type = ["cdylib"]` for wasm32-wasi-preview2 will land alongside
# the build.rs wiring; left as default `lib` here so host-side tests work.

[lints]
workspace = true
