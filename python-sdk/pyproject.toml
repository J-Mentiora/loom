[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mentiora-loom"
# Version is single-sourced from loom/__init__.py (__version__) so the package
# can never drift from the runtime value. Bump it there; the build, the wheel
# metadata, and the publish workflow's tag-match check all read that one source.
dynamic = ["version"]
description = "Python client library for the loom browser-automation daemon"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
readme = "README.md"
keywords = ["browser", "automation", "loom"]
authors = [{ name = "Mentiora", email = "hello@mentiora.ai" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/mentiora-ai/loom"
Repository = "https://github.com/mentiora-ai/loom"
Issues = "https://github.com/mentiora-ai/loom/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

# Distribution name is `mentiora-loom`; the import package stays `loom`.
[tool.hatch.version]
path = "loom/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["loom"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
