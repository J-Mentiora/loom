version: "3.9"

services:
  loom-daemon:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: loom-daemon:latest
    container_name: loom-daemon
    restart: unless-stopped
    environment:
      LOOM_DATA_ROOT: /var/lib/loom
      LOOM_SOCKET_PATH: /var/lib/loom/loom.sock
      LOOM_LOG_PATH: /var/lib/loom/daemon.log
      LOOM_OTEL_ENABLED: "${LOOM_OTEL_ENABLED:-false}"
    volumes:
      - loom-data:/var/lib/loom
    # loom uses a Unix socket — no TCP port exposed
    healthcheck:
      # Daemon-scoped: the image ships no Chromium/AOT artifacts until
      # `loom postinstall` is run, so a full `loom doctor` always exits 1.
      test: ["CMD", "/usr/local/bin/loom", "doctor", "--daemon-only"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  loom-data:
    driver: local
