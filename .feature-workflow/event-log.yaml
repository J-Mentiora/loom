# Event-log substrate config — hosted GCP backend.
# Routes /feature process telemetry to the shared Cloud SQL event-log
# (project feature-workflow-log) instead of writing JSONL into this repo.
#
# Access: be a member of mentiora-prod-developers@mentiora.ai and run
# services/event-log-gcp/onboard-teammate.sh (in the feature-workflow-internal
# repo) once. No access → writes fall back to a local queue and never block.
backend: gcp_cloud_sql
gcp_cloud_sql:
  cloud_run_url: https://event-log-25ovl45yta-uc.a.run.app
  timeout_seconds: 2
